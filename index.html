<!DOCTYPE html>
<html>
  <head>
    <title>sokoburger</title>
    <link rel="stylesheet" href="halfbox.css">
  </head>
  <body onresize="resizedWindow()">
    <div class="centred" id="gameWindow">
      <canvas class="centred" id="mainCanvas"></canvas>
      <canvas class="centred" id="topCanvas"></canvas>
      <canvas class="centred" id="cursorCanvas"></canvas>
      <div class="centred" id="menu">
        <button type="submit" class="menuButton" id="play" onclick="startGame()">🍔</button>
        <button type="submit" class="inactiveMenuButton" id="levelSelect" onclick="levelSelectScreen()">🔢</button>
        <button type="submit" class="inactiveMenuButton" id="settings" onclick="settingsScreen()">⚙️</button>
        <button type="submit" class="inactiveMenuButton" id="quit" onclick="quitGame()">🚪</button>
      </div>
    </div>
    <script src="sempu.js"></script>
  </body>
</html>
