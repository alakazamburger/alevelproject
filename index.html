<!DOCTYPE html>
<html>
  <head>
    <title>sokoburger</title>
    <link rel="stylesheet" href="halfbox.css">
  </head>
  <body onresize="resizedWindow()">
    <canvas class="centred" id="mainCanvas"></canvas>
    <canvas class="centred" id="topCanvas"></canvas>
    <canvas class="centred" id="cursorCanvas"></canvas>
    <div id="menu">
      <button type="submit" class="menuButton" id="play" onclick="startGame()">🍔</button>
      <br>
      <button type="submit" class="menuButton" id="levelSelect" onclick="levelSelectScreen()">🔢</button>
      <br>
      <button type="submit" class="menuButton" id="settings" onclick="settingsScreen()">⚙️</button>
      <br>
      <button type="submit" class="menuButton" id="quit" onclick="quitGame()">🚪</button>
    </div>
    <script src="sempu.js"></script>
  </body>
</html>
